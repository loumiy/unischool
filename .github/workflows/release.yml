name: Release

# The file to upload to itch.io (Plan 97D; the desktop packages of Plan
# 97H wait in the backlog). Runs on a version tag (v0.1.0) or by hand from the Actions
# tab ("Run workflow"). Download the artifact from the run's page and
# upload that file to itch.io as it is (docs/store/itch-release.md).
#
# VITE_POSTHOG_KEY is the repository secret of that name, so the build
# sends play statistics; ITCH_PAGE_URL, a repository variable, is the
# address the report card's share line names (leave it unset until the
# page exists).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

defaults:
  run:
    working-directory: unischool

jobs:
  itch-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: unischool/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build:itch
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_SITE_URL: ${{ vars.ITCH_PAGE_URL }}
      # The game in an itch.io-style frame, in Chrome: saves, downloads, the
      # clipboard's fallback, keys, the wheel, sound and two frames.
      - run: npm run itch:frame -- --check
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # GitHub zips whatever a run attaches, so attaching the zip gave a zip
      # inside a zip, and itch.io found no index.html. The built folder is
      # attached instead: GitHub's own zip of it, with index.html at the
      # root, is the file to upload as it downloads.
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: unischool-${{ steps.version.outputs.version }}-itch-web
          path: unischool/dist-itch/
          if-no-files-found: error
