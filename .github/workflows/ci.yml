name: CI

# Every push to any branch; a PR shows the run for its head commit.
on:
  push:

defaults:
  run:
    working-directory: unischool

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: unischool/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The suites that play whole games, in parallel with the fast job.
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: unischool/package-lock.json
      - run: npm ci
      - run: npm run test:slow
