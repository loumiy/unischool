<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" preserveAspectRatio="xMidYMax slice">
  <!-- MOCKUP (styles.css's .title-v-sky): a campus skyline in two flat
       layers, the far one paler, for the title's sky. -->
