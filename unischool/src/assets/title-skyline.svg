    <path d="M0 250 Q120 205 260 228 T540 220 T820 212 T1100 224 T1380 210 T1600 222 V320 H0Z"/>
    <circle cx="90" cy="236" r="34"/><circle cx="140" cy="244" r="26"/>
    <circle cx="1460" cy="226" r="36"/><circle cx="1515" cy="238" r="28"/>
    <rect x="1180" y="168" width="70" height="70"/><path d="M1172 170 1215 140 1258 170Z"/>
    <rect x="330" y="180" width="90" height="60"/><path d="M322 182 375 152 428 182Z"/>
  </g>
  <g fill="#2f5486">
    <!-- the ground -->
    <rect x="0" y="282" width="1600" height="38"/>
    <!-- trees -->
    <circle cx="60" cy="262" r="30"/><circle cx="105" cy="272" r="22"/>
    <circle cx="470" cy="262" r="28"/><circle cx="510" cy="270" r="20"/>
    <circle cx="1105" cy="260" r="30"/><circle cx="1150" cy="270" r="22"/>
    <circle cx="1545" cy="258" r="32"/>
    <!-- a long gabled hall -->
    <rect x="150" y="210" width="260" height="76"/><path d="M140 212 280 168 420 212Z"/>
    <rect x="200" y="186" width="16" height="22"/>
    <!-- the temple front, the mark's own -->
    <path d="M560 196 700 140 840 196Z"/>
    <rect x="568" y="204" width="264" height="10"/>
    <rect x="590" y="214" width="30" height="62"/><rect x="655" y="214" width="30" height="62"/>
    <rect x="715" y="214" width="30" height="62"/><rect x="780" y="214" width="30" height="62"/>
    <rect x="556" y="276" width="288" height="10"/>
    <!-- the clock tower -->
    <rect x="880" y="120" width="56" height="166"/><path d="M872 122 908 70 944 122Z"/>
    <circle cx="908" cy="150" r="14" fill="#7ea6d4"/>
    <!-- the domed library -->
    <rect x="960" y="206" width="170" height="80"/>
    <path d="M985 206 A60 52 0 0 1 1105 206Z"/><rect x="1040" y="140" width="10" height="20"/>
    <!-- a tall hall with a stair of roofs -->
    <rect x="1200" y="196" width="150" height="90"/><path d="M1192 198 1275 160 1358 198Z"/>
    <rect x="1350" y="230" width="140" height="56"/><path d="M1344 232 1420 204 1496 232Z"/>
